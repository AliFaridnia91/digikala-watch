# Checks the Digikala product about every 2 minutes and sends a Telegram message whenever
# a variant comes in stock that was not on sale at the previous check. The last
# seen variants are kept in state.json, committed back to the repo when they change.
#
# GitHub starts scheduled runs late, often hours apart, so each run keeps checking
# for ~5h40m (jobs may last 6 hours) and then starts the next run itself. The cron
# is only a backup in case that chain breaks. Keep the repository public: Actions
# minutes are free and unlimited there. To stop, disable the workflow.
name: Digikala watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test Telegram message"
        type: boolean
        default: false

concurrency:
  group: digikala-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PRODUCT: "21696246"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Test alert
        if: ${{ inputs.test_alert }}
        run: python3 -u dk_watch.py "$PRODUCT" --test-alert

      - name: Watch for ~5h40m
        if: ${{ !inputs.test_alert }}
        run: python3 -u dk_watch.py "$PRODUCT" --track-new state.json --interval 120 --jitter 10 --duration 20400

      - name: Save what is on sale now
        if: ${{ always() && !inputs.test_alert }}
        run: |
          git diff --quiet -- state.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update on-sale variants" -- state.json
          git pull --rebase -X theirs && git push

      - name: Start the next run
        if: ${{ !cancelled() && !inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" -f test_alert=false
