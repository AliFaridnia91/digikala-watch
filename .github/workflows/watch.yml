# Checks the Digikala product every minute and sends a Telegram message whenever
# a variant comes in stock that was not on sale at the previous check. The last
# seen variants are kept in state.json, committed back to the repo when they change.
#
# GitHub only starts scheduled runs every few minutes (and sometimes late), so
# each run is started every 30 minutes and keeps checking once a minute for ~28
# minutes. Keep the repository public: Actions minutes are free and unlimited there.
name: Digikala watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Only send a test Telegram message"
        type: boolean
        default: false

concurrency:
  group: digikala-watch
  cancel-in-progress: false

permissions:
  contents: write

env:
  PRODUCT: "21696246"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Test alert
        if: ${{ inputs.test_alert }}
        run: python3 -u dk_watch.py "$PRODUCT" --test-alert

      - name: Watch for ~28 minutes
        if: ${{ !inputs.test_alert }}
        run: python3 -u dk_watch.py "$PRODUCT" --track-new state.json --interval 60 --duration 1680

      - name: Save what is on sale now
        if: ${{ always() && !inputs.test_alert }}
        run: |
          git diff --quiet -- state.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update on-sale variants" -- state.json
          git pull --rebase -X theirs && git push
